services:
  db:
    image: postgres:16-alpine
    container_name: cfl401-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Obligatoria: sin una contraseña ya definida el contenedor arrancaría con
      # una débil por defecto. `:?` hace que `docker compose up` falle si no está.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria (ver .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-cfl401}
    ports:
      # Solo accesible desde el host (loopback); no se expone al exterior.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cfl401}']
      interval: 5s
      timeout: 5s
      retries: 5

  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init-runner
    container_name: cfl401-init
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-cfl401}?schema=public
      # Las migraciones y el seed los corre este servicio una sola vez, antes de
      # que arranque web (que además espera a que init termine bien).
      # RUN_MIGRATIONS=false solo para este servicio: el entrypoint de web
      # repite `migrate deploy`, que es idempotente pero no hacía falta.
      RUN_SEED: ${RUN_SEED:-false}
      RUN_MIGRATIONS: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfl401-web
    ports:
      - '4088:3000'
    healthcheck:
      # Verifica que la app responde de verdad, no solo que el proceso existe:
      # /api/health da 503 si la base no está accesible.
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/api/health || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:-cfl401}?schema=public
      # Obligatoria: usada para firmar los JWT de sesión. Un default fijo
      # permitiría forjar tokens. Generala con `openssl rand -hex 32`.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET es obligatoria (ver .env.example)}
      # web no corre migraciones ni seed: de eso se encarga el servicio init.
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      # En desarrollo la app habla directo con el host y no hay proxy que fije la
      # IP real. Ponelo en `true` solo detrás de Nginx/Traefik/Dokploy; si no, los
      # límites por IP comparten una única clave para todas las conexiones.
      TRUST_PROXY: ${TRUST_PROXY:-false}
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # Rebuild automático: con `docker compose watch` cada cambio en los archivos
    # del proyecto reconstruye la imagen y recrea el contenedor web.
    develop:
      watch:
        - path: .
          action: rebuild
          ignore:
            - node_modules
            - .next
            - .git

  # Respaldo manual de la base. No corre en el arranque normal (perfil
  # "backup"): se ejecuta a demanda y deja un dump comprimido en ./backups.
  #
  #   docker compose --profile backup run --rm backup
  backup:
    image: postgres:16-alpine
    container_name: cfl401-backup
    profiles: ['backup']
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria (ver .env.example)}
      PGDATABASE: ${POSTGRES_DB:-cfl401}
      BACKUP_DIR: /backups
    volumes:
      - ./backups:/backups
      - ./scripts/backup-db.sh:/usr/local/bin/backup-db.sh:ro
    entrypoint: ['sh', '/usr/local/bin/backup-db.sh']

volumes:
  postgres_data:
