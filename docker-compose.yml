services:
  db:
    image: postgres:16-alpine
    container_name: cfl401-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cfl401}
    ports:
      # Solo accesible desde el host (loopback); no se expone al exterior.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cfl401}']
      interval: 5s
      timeout: 5s
      retries: 5

  init:
    build:
      context: .
      dockerfile: Dockerfile
      target: init-runner
    container_name: cfl401-init
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cfl401}?schema=public
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cfl401-web
    ports:
      - '4088:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cfl401}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-cfl401-dev-secret-cambiar-en-produccion}
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    # Rebuild automático: con `docker compose watch` cada cambio en los archivos
    # del proyecto reconstruye la imagen y recrea el contenedor web.
    develop:
      watch:
        - path: .
          action: rebuild
          ignore:
            - node_modules
            - .next
            - .git

volumes:
  postgres_data:
