services:
  db:
    image: postgres:16-alpine
    container_name: cfl401-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cfl401}
    ports:
      # Solo accesible desde el host (loopback); no se expone al exterior.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cfl401}']
      interval: 5s
      timeout: 5s
      retries: 5

  init:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: init-runner
    container_name: cfl401-init
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cfl401}?schema=public
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: cfl401-backend
    ports:
      - '4089:3000'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cfl401}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-cfl401-dev-secret-cambiar-en-produccion}
    depends_on:
      db:
        condition: service_healthy
      init:
        condition: service_completed_successfully
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: cfl401-frontend
    ports:
      - '4088:3000'
    environment:
      BACKEND_URL: http://backend:3000
    depends_on:
      backend:
        condition: service_started
volumes:
  postgres_data:
